<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chinmoy - personal profile">
  <title>Chinmoy | Personal Space</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>

  <main class="card">
    <div class="topbar">
      <span class="dot"></span>
      <span>WELCOME TO MY SPACE</span>
    </div>

    <section class="hero">
      <div class="profile-wrap">
        <img src="images/photo2.jpg" alt="Chinmoy" class="profile">
        <span class="status"></span>
      </div>

     <div class="container">

        <h2>
            I'm <span class="name" id="name"></span>
            <span class="cursor"></span>
        </h2>

        <div class="work" id="work"></div>

    </div>


    <script>

        const nameText = "Chinmoy Deka";

        const works = [
            "MCA Student",
            "AI/ML Learner",
            "Developer",
            
        ];

        let nameIndex = 0;
        let workIndex = 0;
        let charIndex = 0;


        // Name typing
        function typeName() {

            if (nameIndex < nameText.length) {

                document.getElementById("name").textContent +=
                    nameText.charAt(nameIndex);

                nameIndex++;

                setTimeout(typeName, 150);

            } else {

                setTimeout(typeWork, 500);
            }
        }


        // Work typing
        function typeWork() {

            if (charIndex < works[workIndex].length) {

                document.getElementById("work").textContent +=
                    works[workIndex].charAt(charIndex);

                charIndex++;

                setTimeout(typeWork, 100);

            } else {

                setTimeout(deleteWork, 1500);
            }
        }


        // Delete work
        function deleteWork() {

            if (charIndex > 0) {

                document.getElementById("work").textContent =
                    works[workIndex].substring(0, charIndex - 1);

                charIndex--;

                setTimeout(deleteWork, 50);

            } else {

                workIndex++;

                if (workIndex >= works.length) {
                    workIndex = 0;
                }

                setTimeout(typeWork, 500);
            }
        }


        // Start animation
        typeName();

    </script>

      
      <div class="links">
        <!-- Replace the # links below with your real profiles -->
       
      
      </div>
    </section>

    <section class="about">
      <h2>A little about me</h2>
      <p>
        I'm exploring Python, Machine Learning, NLP, Deep Learning and Django.
        I enjoy learning by building practical projects.
      </p>
      <div class="chips">
        <span>🐍 Python</span>
        <span>🤖 AI/ML</span>
        <span>🧠 NLP</span>
        <span>🌐 Django</span>
      </div>
    </section>

    <section class="gallery">
      <div class="section-head">
        <h2>Recent Moments</h2>
        <span>Swipe / tap</span>
      </div>
      <div class="photos">
        <img src="images/photo1.jpg" alt="Chinmoy at night" loading="lazy">
        <img src="images/photo2.jpg" alt="Chinmoy portrait" loading="lazy">
        <img src="images/photo3.jpg" alt="Chinmoy travelling" loading="lazy">
        <img src="images/photo4.jpg" alt="Chinmoy travelling" loading="lazy">
      </div>
    </section>

    <footer>Made with curiosity & code ✨</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
